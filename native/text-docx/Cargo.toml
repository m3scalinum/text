[package]
name = "sharp-text-docx"
version = "0.1.0"
edition = "2024"
# `zip` 9.8 asks for 1.88; edition 2024 asks for 1.85. The higher floor wins.
rust-version = "1.88"
publish = false
description = "C ABI over a DOCX reader, for M3scalinum.Text.Docx"
license = "Apache-2.0"

[lib]
name = "sharp_text_docx"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The container, and only the container: `default-features = false` keeps the AES, bzip2, lzma,
# zstd and deflate64 decoders — and their advisories — out of the graph. A `.docx` is stored or
# deflated, and those are the only two methods a package may use here.
zip = { version = "9.8", default-features = false, features = ["deflate"] }
# The XML: a read-only tree with no DTD and no entity expansion, which is the property that matters
# when the bytes come from the sender.
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# catch_unwind at the FFI boundary requires unwinding: never set panic = "abort".
panic = "unwind"
strip = "debuginfo"

[profile.dev]
panic = "unwind"
