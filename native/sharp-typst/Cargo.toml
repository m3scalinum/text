[package]
name = "sharp-typst"
version = "0.15.1"
edition = "2024"
# The typst 0.15.1 crates declare Rust 1.92, so that is the real floor of this crate.
rust-version = "1.92"
publish = false
description = "C ABI over the Typst compiler, for SharpTypst"
license = "Apache-2.0"

[lib]
name = "sharp_typst"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-html = "0.15.1"
typst-bundle = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "system-packages", "system-downloader", "scan-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `typst-kit`'s system downloader pulls `native-tls`, which links OpenSSL. A musl host has neither a
# system libssl nor a pkg-config path for one, so the musl build vendors OpenSSL; every other target
# keeps linking the system library.
[target.x86_64-unknown-linux-musl.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
# catch_unwind at the FFI boundary requires unwinding: never set panic = "abort".
panic = "unwind"
strip = "debuginfo"

[profile.dev]
panic = "unwind"
