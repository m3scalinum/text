[package]
name = "sharp-text-pdf"
version = "0.1.0"
edition = "2024"
# `hayro` 0.9 declares Rust 1.92, ahead of the 1.85 edition 2024 asks for, so 1.92 is the floor of
# this crate. tools/check-msrv.py holds the number to the resolved graph.
rust-version = "1.92"
publish = false
description = "C ABI over a PDF page rasteriser, for M3scalinum.Text.Pdf"
license = "Apache-2.0"

[lib]
name = "sharp_text_pdf"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The rasteriser: a pure-Rust CPU renderer, so rendering a page needs no native PDF engine, no
# system poppler, and no font on the host. Apache-2.0 OR MIT. The same major as `native/text-ocr`
# runs: one hayro in the suite, one set of advisories, one CVE to watch.
hayro = "0.9"
# The options document a caller sends and the metadata a render returns. The image itself crosses as
# bytes, never as JSON: base64 would cost a third more memory for nothing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JPEG encoder. `image` is already in this crate's graph — `hayro` decodes PNG with it — so the
# only thing this line adds is the `jpeg` feature: no new package, no new lock entry, and the
# `zune-jpeg`/`zune-core` pair the feature needs is already locked through `hayro-syntax`. MIT OR
# Apache-2.0, the same terms as the rest of the suite, and it is already a row in
# docs/specifications/dependencies.md. `default-features = false` keeps `rayon` and the dozen other
# codecs out of the build.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
# catch_unwind at the FFI boundary requires unwinding: never set panic = "abort".
panic = "unwind"
strip = "debuginfo"

[profile.dev]
panic = "unwind"
