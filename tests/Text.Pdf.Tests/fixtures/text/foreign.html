<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text extraction from a browser print</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; font-size: 12pt; margin: 2cm; }
  h1 { font-size: 20pt; }
  table { border-collapse: collapse; margin-top: 1em; }
  td, th { border: 1px solid #888; padding: 4px 8px; text-align: left; }
  .footnote { font-size: 9pt; color: #444; margin-top: 2em; border-top: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Browser printed document</h1>
<p>QUOKKAFOREIGN is the marker this fixture is checked for. The paragraph exists to prove that a
producer other than the compiler is read the same way.</p>
<table>
  <tr><th>Fruit</th><th>Count</th></tr>
  <tr><td>apple</td><td>3</td></tr>
  <tr><td>pear</td><td>7</td></tr>
</table>
<p class="footnote">1. A footnote the browser laid out at the bottom.</p>
</body>
</html>
