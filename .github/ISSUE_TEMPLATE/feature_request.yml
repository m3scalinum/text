name: Feature request
description: Propose a capability, an API change, or a behaviour that should be different.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The suite releases as two trains: the compiler packages follow the Typst version they embed,
        the `Pdf` packages follow `TextVersion`. A request that depends on a newer Typst release is
        worth saying so explicitly — it moves the first train, not the second.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I checked the specifications in docs/specifications/ for the current contract.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behaviour you would like. A sketch of the call site helps.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they are not enough.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compilation and export
        - PDF standards and metadata
        - Fonts and packages
        - Document model
        - Templates and the generator
        - Dependency injection
        - Diagnostics
        - PDF signature
        - Native ABI and packaging
        - Performance
        - Documentation
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
