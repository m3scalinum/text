name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  csharp:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # No build: the managed layer is extracted from source, which keeps this job independent
          # of the native library and of the .NET 11 SDK.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  actions:
    name: analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
