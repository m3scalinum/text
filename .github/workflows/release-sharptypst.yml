name: release (Typst)

on:
  push:
    tags: ['sharptypst-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet.org
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Read-only by default; the publish job adds id-token: write for trusted publishing.
permissions:
  contents: read


jobs:
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            lib: sharp_typst.dll
            target: ""
          - os: windows-11-arm
            rid: win-arm64
            lib: sharp_typst.dll
            target: ""
          - os: ubuntu-latest
            rid: linux-x64
            lib: libsharp_typst.so
            target: ""
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib: libsharp_typst.so
            target: ""
          # Alpine and musl-based container images cannot load the glibc build, and NuGet's RID
          # graph resolves linux-musl-x64 to linux-x64 without a word. This entry is what makes the
          # package usable in the default .NET container image.
          - os: ubuntu-latest
            rid: linux-musl-x64
            lib: libsharp_typst.so
            target: x86_64-unknown-linux-musl
          # One thin dylib per architecture, each a host build on its own runner: no cross target,
          # no `lipo`, and no x86_64 slice in an Apple-silicon consumer's output.
          - os: macos-15
            rid: osx-arm64
            lib: libsharp_typst.dylib
            target: ""
          - os: macos-15-intel
            rid: osx-x64
            lib: libsharp_typst.dylib
            target: ""
    env:
      # Empty for a host build; `--target <triple>` for the musl entry.
      CRT_TARGET: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
      # musl-gcc comes from musl-tools: the default cc would link a glibc binary that Alpine
      # cannot load. OpenSSL is vendored for this target in Cargo.toml, so no libssl is needed.
      RUSTFLAGS: ${{ matrix.target != '' && '-C linker=musl-gcc' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sharp-typst
      - name: Install the musl toolchain
        if: matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Format
        run: cargo fmt --check --manifest-path native/sharp-typst/Cargo.toml
      - name: Lint
        run: cargo clippy $CRT_TARGET --manifest-path native/sharp-typst/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test $CRT_TARGET --manifest-path native/sharp-typst/Cargo.toml
      - name: Build
        if: matrix.target == ''
        run: cargo build --release --manifest-path native/sharp-typst/Cargo.toml
      - name: Build (musl)
        if: matrix.target != ''
        run: |
          # Rust cannot emit a cdylib for a musl target: it drops the crate type with a warning and
          # produces only the staticlib. Link that into a shared object, forcing every tn_* entry
          # point to be kept, then strip it (75 MB instead of 90).
          cargo build --release $CRT_TARGET --manifest-path native/sharp-typst/Cargo.toml
          archive="native/sharp-typst/target/${{ matrix.target }}/release/libsharp_typst.a"
          symbols=$(nm -g --defined-only "$archive" | awk '$2=="T" && $3 ~ /^tn_/ {print "-Wl,-u,"$3}')
          musl-gcc -shared -o native/sharp-typst/target/release/libsharp_typst.so \
            $symbols "$archive" -lpthread -ldl -lm
          strip --strip-all native/sharp-typst/target/release/libsharp_typst.so
          ls -la native/sharp-typst/target/release/libsharp_typst.so
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/sharp-typst/target/release/${{ matrix.lib }}
          if-no-files-found: error

  pack:
    name: pack
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native/artifacts
      - name: Lay out the natives
        run: |
          for dir in native/artifacts/native-*; do
            rid="${dir##*/native-}"
            mkdir -p "native/artifacts/$rid"
            cp -r "$dir"/* "native/artifacts/$rid/"
          done
      - run: dotnet restore
      - name: Check the release notes
        # A tag without its changelog section would reach nuget.org and only then fail to describe
        # what it published. Checked before anything is packed, so the run stops here instead.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1].removeprefix("sharptypst-v")
          text = pathlib.Path("CHANGELOG-Typst.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S
          )
          if not section or not section.group(1).strip():
              sys.exit(f"CHANGELOG-Typst.md has no '## [{version}]' section with content: write it before tagging")
          PY
      - name: Pack
        run: |
          # The tag carries the Typst version and the build revision (sharptypst-v0.15.1.4): this package
          # family versions itself after the compiler it embeds, and the fourth component counts
          # wrapper releases for a given compiler. A manual dispatch has no tag, so it falls back
          # to the run number.
          typst="$(grep -oP '(?<=<TypstVersion>)[^<]+' Directory.Build.props)"
          revision="${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#sharptypst-v}"
            if [[ "$version" != "$typst".* ]]; then
              echo "tag sharptypst-v$version does not start with TypstVersion $typst" >&2
              exit 1
            fi
            revision="${version#"$typst".}"
            if ! [[ "$revision" =~ ^[0-9]+$ ]]; then
              echo "tag sharptypst-v$version: build revision '$revision' is not a number" >&2
              exit 1
            fi
          fi
          dotnet pack src/Text.Documents -c Release -o artifacts/packages -p:BuildRevision="$revision"
          dotnet pack src/Text.Typst -c Release -o artifacts/packages -p:BuildRevision="$revision"
          dotnet pack src/Text.Typst.DependencyInjection -c Release -o artifacts/packages -p:BuildRevision="$revision"
          dotnet pack src/Text.Templates.Generator -c Release -o artifacts/packages -p:BuildRevision="$revision"
      - name: Verify the packages
        # Never publish a package with no runtimes/ entry or a dependency on M3scalinum.Text.Typst.Native.
        run: |
          for package in artifacts/packages/*.nupkg; do
            python3 tests/verify-package.py "$package"
          done
      - name: Generate the SBOMs
        # One CycloneDX SBOM per .nupkg, built from the package itself: the .nuspec names the
        # referenced packages, runtimes/<rid>/native names the RIDs and the native library, and the
        # library names the crate whose Cargo.lock is the Rust side of the graph.
        run: python3 .github/sbom/sbom.py generate --packages artifacts/packages --output artifacts/sbom
      - name: Verify the SBOMs
        # Fails when an SBOM is empty, omits the crate the compiler wrapper embeds, or misses a RID
        # the package ships.
        run: python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*
      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

  attest:
    name: attest
    needs: [pack]
    runs-on: ubuntu-latest
    # Build provenance for the packages this run produced. GitHub only issues attestations for a
    # public repository or GitHub Enterprise Cloud; m3scalinum/text is public, which is exactly what
    # lets a consumer run `gh attestation verify` on a downloaded .nupkg. The token scopes are the
    # two the attestation API needs and nothing else.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/download-artifact@v8
        with:
          name: sboms
          path: artifacts/sbom
      - name: Verify the SBOMs as shipped
        # Re-checked here rather than trusting the pack job's log: these are the files the
        # attestation covers.
        run: python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/sbom/*.cdx.json

  test:
    name: test
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Text.Typst.Tests -c Release --no-build
      - name: Generator tests
        run: dotnet test tests/Text.Templates.Generator.Tests -c Release --no-build
      - name: Integration tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Typst.Integration.Tests -c Release --no-build
  publish:
    name: publish
    needs: [pack, test, attest]
    # `inputs.publish` is the string "false" in this context, which is truthy; `github.event.inputs`
    # is the string form and compares unambiguously.
    if: startsWith(github.ref, 'refs/tags/sharptypst-v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    # Trusted publishing: the job asks GitHub for an OIDC token, exchanges it on nuget.org for a
    # temporary API key, and pushes with that. No long-lived secret is stored anywhere.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: NuGet login (OIDC → temporary API key)
        # The key lives one hour and the token is single-use, so this step sits right before the
        # pushes. `user` is the nuget.org profile name, not the e-mail address.
        uses: NuGet/login@v1
        id: login
        with:
          user: m3scalinum
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
      - name: Push symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for symbols in artifacts/packages/*.snupkg; do
            [ -e "$symbols" ] || continue
            dotnet nuget push "$symbols" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  release:
    name: release
    needs: [publish]
    # Only a tag names a version; a dispatch has no page to create.
    if: startsWith(github.ref, 'refs/tags/sharptypst-v')
    runs-on: ubuntu-latest
    # The one job that writes to the repository: it creates the GitHub release page.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/download-artifact@v8
        with:
          name: sboms
          path: artifacts/sbom
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#sharptypst-v}"
          # The body is this build's own CHANGELOG section, so the page and the file never disagree.
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG-Typst.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = match.group(1).strip() if match else ""
          # A missing section used to fall back to a one-line page, which publishes a release with no
          # notes and nobody notices. The changelog is not written by CI: renaming [Unreleased] to
          # the version being tagged is part of preparing the release, so its absence is an error.
          if not body:
              sys.exit("CHANGELOG-Typst.md has no '## [%s]' section with content: write the release entry before tagging" % version)
          print(body)
          PY
          # The generator package ships no symbols, so the snupkg list is built rather than globbed.
          assets=()
          for file in artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/sbom/*.cdx.json; do
            if [ -e "$file" ]; then assets+=("$file"); fi
          done
          # A re-run must not go red because the page already exists: edit it and replace the assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "M3scalinum.Text.Typst $version" --notes-file notes.md --verify-tag
          fi
