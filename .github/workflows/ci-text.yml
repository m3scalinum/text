name: ci (Text suite)

on:
  push:
    branches: [main]
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Bump this to invalidate the native caches below; the crate source is hashed into the key.
  NATIVE_CACHE_VERSION: v1

# Read-only by default: no job here writes to the repository. The publish job of release-text.yml
# overrides this with the OIDC permission it needs.
permissions:
  contents: read

# A branch pushed three times otherwise runs three pipelines over the same commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  changes:
    # One comparison, no third-party action: does this change touch anything but markdown? The two
    # workflows that run on every pull request used to answer that question by running everything; a
    # documentation pull request started forty Rust builds to reach the drift test. `code` gates the
    # heavy jobs, and a base we cannot resolve (a force-push, the first push of a branch) answers
    # `true`, because being slow is cheaper than being wrong.
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base to compare against; treating this as a code change"
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed" | sed 's/^/  /'
          if grep -qvE '\.md$|^(LICENSE|NOTICE|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md)' <<< "$changed"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo "markdown only" 
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  native:
    # Distinct from the compiler workflow's job of the same purpose: two jobs sharing a check name
    # make a required status check ambiguous.
    name: native (linux-x64, suite)
    runs-on: ubuntu-latest
    steps:
      # Only one RID: the suite builds and runs once, on the runner. The shipped runtimes,
      # their tests and the leak soak belong to the compiler workflow.
      #
      - uses: actions/checkout@v7
      # Scoped `-suite-` on purpose: this job only *builds*, the compiler workflow's linux-x64 entry
      # also runs fmt, clippy and the crate's tests. A shared key would let whichever ran first skip
      # the other's gates. Restored after the checkout, because `hashFiles` reads the workspace.
      - uses: actions/cache@v4
        id: natives
        with:
          path: native/artifacts/linux-x64
          key: natives-typst-linux-x64-suite-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/sharp-typst/Cargo.toml', 'native/sharp-typst/Cargo.lock', 'native/sharp-typst/build.rs', 'native/sharp-typst/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.natives.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.natives.outputs.cache-hit != 'true'
        with:
          workspaces: native/sharp-typst
      - name: Build
        if: steps.natives.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path native/sharp-typst/Cargo.toml
      - name: Stage the library
        if: steps.natives.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p native/artifacts/linux-x64
          cp native/sharp-typst/target/release/libsharp_typst.so native/artifacts/linux-x64/
          ls -l native/artifacts/linux-x64/
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64/libsharp_typst.so
          if-no-files-found: error

  native-pdf:
    # One library, deliberately. `suite` runs the drift test and the Pdf coverage gate; the gate needs
    # the rasteriser present, or its thirty raster tests skip and the file counts as uncovered. It used
    # to `need:` the whole forty-job matrix for this single artifact, so a README edit paid for eight
    # architectures of five crates. This job builds and stages exactly what `suite` downloads.
    name: native (text-pdf, linux-x64, for the suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: natives
        with:
          path: native/artifacts/linux-x64
          key: natives-text-pdf-linux-x64-suite-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/text-pdf/Cargo.toml', 'native/text-pdf/Cargo.lock', 'native/text-pdf/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.natives.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.natives.outputs.cache-hit != 'true'
        with:
          workspaces: native/text-pdf
      - name: Build
        if: steps.natives.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path native/text-pdf/Cargo.toml
      - name: Stage the library
        if: steps.natives.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p native/artifacts/linux-x64
          cp native/text-pdf/target/release/libsharp_text_pdf.so native/artifacts/linux-x64/
          ls -l native/artifacts/linux-x64/
      - uses: actions/upload-artifact@v7
        # A single file at the artifact root, not the `native/artifacts` tree: `suite` downloads it
        # straight into `native/artifacts/linux-x64`, and a nested directory would put the library one
        # level too deep for the `SHARPTEXTPDF_NATIVE_PATH` it sets. The name is distinct from the
        # matrix's `text-pdf-linux-x64` so a code pull request, where both jobs run, does not collide.
        with:
          name: text-pdf-linux-x64-suite
          path: native/artifacts/linux-x64/libsharp_text_pdf.so
          if-no-files-found: error

  suite:
    name: suite
    # The coverage gate for M3scalinum.Text.Pdf runs in this job, and the raster tests only execute
    # when the native library is present: without it they skip and the raster code counts as
    # uncovered. The one library the gate needs is downloaded below, not the whole matrix.
    needs: [native-pdf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: text-pdf-linux-x64-suite
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Public surface and documentation
        # Loads every assembly of the suite by reflection, then reads docs/specifications, wiki/ and
        # README.md. A documented type or method that does not exist fails here.
        run: dotnet test tests/Text.Suite.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (pdf)
        env:
          SHARPTEXTPDF_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_pdf.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/pdf.xml
          "dotnet test tests/Text.Pdf.Tests -c Release --no-build"
      - name: Merge
        run: >
          dotnet-coverage merge -f cobertura -o artifacts/coverage/coverage.xml
          artifacts/coverage/pdf.xml
      - name: Gate
        # The coverage gate for this train lives here, not in the compiler workflow: a change to
        # these packages no longer starts that workflow, so its gate would never see it.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/coverage.xml 90
          --require M3scalinum.Text.Pdf
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-text
          path: artifacts/coverage/coverage.xml

  templates:
    name: templates
    # The pack ships layouts, and the only way to know a layout renders is to render it: these
    # tests need the native compiler, which the suite job deliberately does not download.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Templates.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (templates)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/templates.xml
          "dotnet test tests/Text.Templates.Tests -c Release --no-build"
      - name: Gate
        # Only the pack's own assembly: the compiler wrapper is linked into the output as a
        # dependency, and counting its lines here would measure code no test in this run touches.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/templates.xml 90
          --require M3scalinum.Text.Templates
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-templates
          path: artifacts/coverage/templates.xml
      - name: Pack
        run: dotnet pack src/Text.Templates -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # The same check the release runs: a satellite must pin the core version it was built
        # against, and the licence files must be in the package.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Templates.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-templates
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  mcp:
    name: mcp
    # The protocol surface needs no compiler, but the render tools and the invoice payload do: the
    # job downloads the same artifact the templates job uses, so the coverage it collects measures the
    # tools a client actually calls rather than their argument checks alone.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (mcp)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/mcp.xml
          "dotnet test tests/Text.Mcp.Tests -c Release --no-build"
      - name: Gate
        # Only the server's own assembly: the compiler wrapper and the e-invoicing package are linked
        # into the output as dependencies, and counting their lines would measure code these tests
        # use rather than code they own.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/mcp.xml 90
          --require M3scalinum.Text.Mcp
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-mcp
          path: artifacts/coverage/mcp.xml
      - name: Pack
        run: dotnet pack src/Text.Mcp -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # A satellite must pin the core version it was built against, and carry the licence files.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Mcp.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-mcp
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  text:
    name: text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        # Neither package touches the compiler: signing takes bytes and returns bytes, and the MCP
        # server's protocol tests need nothing either; its render tests skip themselves without the
        # native library.
        run: |
          dotnet test tests/Text.Pdf.Tests -c Release --no-build
          dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Pack
        run: |
          dotnet pack src/Text.Pdf -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages-text
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  native-extras:
    # The five libraries that are not the compiler: barcodes, OCR, the DOCX and XLSX readers, and the
    # PDF page rasteriser. Each is its own crate with its own Cargo.lock, and before this job existed
    # nothing compiled them — a Dependabot bump of `zip` in native/text-docx reached main with every
    # check green and a broken build.
    #
    # Skipped when a pull request touches no code. Forty runner-minutes of Rust, including four macOS
    # slices, used to start for a README edit, because `suite` needed one library from this matrix and
    # `needs:` cannot take a single cell of it: `native-pdf` builds that one, and everything below
    # cascades — `extras`, both `musl` jobs, `examples`, `sbom` and the coverage table all `need:` this
    # job and skip with it.
    if: needs.changes.outputs.code == 'true'
    name: native (${{ matrix.crate }}, ${{ matrix.rid }})
    needs: [changes]
    # Eight RIDs per crate, the same set the package ships, because `verify-package.py` demands every
    # one of them: a linux-only job packs a package with one native and the check then fails, or worse,
    # passes for a package missing seven architectures. That is the compiler's seven, `linux-musl-x64`
    # and the two macOS slices included, plus `linux-musl-arm64` — the five crates carry a
    # hand-linked musl build for the same reason the compiler does, so an Alpine consumer of
    # `mcr.microsoft.com/dotnet/runtime-deps:11.0-alpine` gets a library it can load, on either
    # architecture.
    strategy:
      fail-fast: false
      matrix:
        crate: [text-barcodes, text-ocr, text-docx, text-xlsx, text-pdf]
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-arm64, osx-x64]
        # `rid` is an axis, not an `include` entry: an include that adds a key absent from every
        # combination is merged into each of them in turn, so the last one wins and the matrix
        # collapses to the crates on macOS alone. Crossing on both axes and letting these entries
        # supply the runner per rid gives the 40 combinations the packages actually need.
        include:
          - { rid: win-x64, os: windows-latest, target: "" }
          - { rid: win-arm64, os: windows-11-arm, target: "" }
          - { rid: linux-x64, os: ubuntu-latest, target: "" }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, target: "" }
          # Alpine and musl-based images cannot load a glibc build, and the RID graph resolves
          # `linux-musl-x64` to `linux-x64` without a word. Built on the x64 pool: the target is a
          # cross-compile, and musl-tools only ships an x86_64 host toolchain.
          - { rid: linux-musl-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # The same gap on the other architecture, closed without a cross toolchain: on the arm64
          # runner `musl-tools` installs an aarch64 musl-gcc, which is the architecture the target
          # links for, so this entry reuses the recipe above instead of adding
          # `aarch64-linux-musl-cross` and a `[target]` linker block to five crates.
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # Two thin dylibs, each built on its own architecture, instead of one universal file
          # whose unused half every consumer pays for: `macos-15` is the arm64 image and
          # `macos-15-intel` the x64 one. Each is a host build: no cross target, no `lipo`.
          - { rid: osx-arm64, os: macos-15, target: "" }
          - { rid: osx-x64, os: macos-15-intel, target: "" }
    runs-on: ${{ matrix.os }}
    env:
      # Empty for a host build; `--target <triple>` for the musl entry.
      CRT_TARGET: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
      # musl-gcc comes from musl-tools: the default cc would link a glibc binary that Alpine cannot
      # load. None of these five crates vendors a C library — the trees are `rxing`/`image`,
      # `ocrs`/`rten`/`hayro`, `zip`/`roxmltree`, `calamine`/`zip` and `hayro`/`vello_cpu`, all pure
      # Rust — so no `[target.x86_64-unknown-linux-musl.dependencies]` block is needed the way
      # OpenSSL is for the compiler.
      RUSTFLAGS: ${{ matrix.target != '' && '-C linker=musl-gcc' || '' }}
    steps:
      - uses: actions/checkout@v7
      # Forty Rust builds that no managed change can invalidate: each crate is hashed on its own,
      # so a pull request touching only C# restores all forty libraries instead of compiling them.
      # Restored after the checkout, because `hashFiles` reads the workspace.
      - uses: actions/cache@v4
        id: natives
        with:
          path: native/artifacts/${{ matrix.rid }}
          key: natives-${{ matrix.crate }}-${{ matrix.rid }}-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles(format('native/{0}/Cargo.toml', matrix.crate), format('native/{0}/Cargo.lock', matrix.crate), format('native/{0}/src/**', matrix.crate)) }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.natives.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.natives.outputs.cache-hit != 'true'
        with:
          workspaces: native/${{ matrix.crate }}
      - name: Install the musl toolchain
        if: steps.natives.outputs.cache-hit != 'true' && matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Format
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo fmt --check
      - name: Clippy
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo clippy $CRT_TARGET --all-targets -- -D warnings
      - name: Unit tests
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        # A musl test binary is statically linked, so it runs on this glibc runner: the entry proves
        # the crate *builds* for musl, the test run proves it passes there too.
        run: cargo test $CRT_TARGET --lib
      - name: Build
        if: steps.natives.outputs.cache-hit != 'true' && matrix.target == ''
        working-directory: native/${{ matrix.crate }}
        run: cargo build --release
      - name: Build (musl)
        if: steps.natives.outputs.cache-hit != 'true' && matrix.target != ''
        working-directory: native/${{ matrix.crate }}
        shell: bash
        run: |
          # Rust cannot emit a cdylib for a musl target: it drops the crate type with a warning and
          # produces only the staticlib. Link that into a shared object, forcing every exported entry
          # point to be kept, then strip it — the compiler's recipe, with this crate's own prefixes.
          cargo build --release $CRT_TARGET
          case "${{ matrix.crate }}" in
            text-barcodes) prefix=bt_ ;;
            text-ocr)      prefix=to_ ;;
            text-docx)     prefix=td_ ;;
            text-xlsx)     prefix=tx_ ;;
            text-pdf)      prefix=tp_ ;;
          esac
          archive=$(ls "target/${{ matrix.target }}/release/libsharp_text_"*.a)
          library=$(basename "$archive" .a)
          symbols=$(nm -g --defined-only "$archive" | awk -v p="$prefix" '$2=="T" && index($3,p)==1 {print "-Wl,-u,"$3}')
          if [ -z "$symbols" ]; then
            echo "no $prefix entry point in $archive: the ABI would be stripped by the linker" >&2
            exit 1
          fi
          echo "exporting $(printf '%s\n' $symbols | wc -l) entry points of $library"
          mkdir -p target/release
          musl-gcc -shared -o "target/release/$library.so" $symbols "$archive" -lpthread -ldl -lm
          strip --strip-all "target/release/$library.so"
          ls -la "target/release/$library.so"
      - name: Stage the library
        if: steps.natives.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "native/artifacts/${{ matrix.rid }}"
          cp native/${{ matrix.crate }}/target/release/*sharp_text*.* "native/artifacts/${{ matrix.rid }}/"
          ls -l "native/artifacts/${{ matrix.rid }}/"
      - uses: actions/upload-artifact@v7
        # The artifact root is `native/artifacts`, so a merged download reassembles `<rid>/<library>`,
        # the layout the csproj files pack from.
        with:
          name: ${{ matrix.crate }}-${{ matrix.rid }}
          path: native/artifacts
          if-no-files-found: error

  extras:
    name: extras
    # Three packages in one job, each carrying its own native library. One job keeps the coverage
    # measurement per assembly explicit rather than spreading three near-identical jobs across the
    # workflow.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
          SHARPTEXTXLSX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_xlsx.so
        run: |
          dotnet test tests/Text.Barcodes.Tests -c Release --no-build
          dotnet test tests/Text.Docx.Tests -c Release --no-build
          dotnet test tests/Text.Ocr.Tests -c Release --no-build
          dotnet test tests/Text.Xlsx.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
          SHARPTEXTXLSX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_xlsx.so
        run: |
          dotnet-coverage collect -f cobertura -o artifacts/coverage/barcodes.xml "dotnet test tests/Text.Barcodes.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/docx.xml "dotnet test tests/Text.Docx.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/ocr.xml "dotnet test tests/Text.Ocr.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/xlsx.xml "dotnet test tests/Text.Xlsx.Tests -c Release --no-build"
          dotnet-coverage merge -f cobertura -o artifacts/coverage/extras.xml artifacts/coverage/barcodes.xml artifacts/coverage/docx.xml artifacts/coverage/ocr.xml artifacts/coverage/xlsx.xml
      - name: Gate
        # One gate per package, not one over the merge: a merged figure lets a package at 62 % hide
        # behind another at 96 %, and it names no culprit when the build goes red. Each package is
        # measured on its own assembly, which is also what `--require` scopes the count to.
        run: |
          python3 tests/coverage-gate.py artifacts/coverage/barcodes.xml 90 --require M3scalinum.Text.Barcodes
          python3 tests/coverage-gate.py artifacts/coverage/docx.xml 90 --require M3scalinum.Text.Docx
          python3 tests/coverage-gate.py artifacts/coverage/ocr.xml 90 --require M3scalinum.Text.Ocr
          python3 tests/coverage-gate.py artifacts/coverage/xlsx.xml 90 --require M3scalinum.Text.Xlsx
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-extras
          path: artifacts/coverage/extras.xml
      - name: Pack
        run: |
          dotnet pack src/Text.Barcodes -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Docx -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Ocr -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Xlsx -c Release --no-build -o artifacts/packages
      - name: Prove the verifier refuses a package without linux-musl-arm64
        # A verifier that only passes proves nothing. The selftest fabricates packages and asserts
        # that one without that RID is refused, so deleting the requirement turns this red instead
        # of quietly shrinking what the next step checks.
        run: python3 tests/verify-package.py --selftest
      - name: Verify the packages
        # Three of them carry a native library each: a missing RID fails here rather than as a
        # DllNotFoundException in a consumer's application.
        run: |
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Barcodes.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Docx.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Ocr.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Xlsx.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-extras
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  musl:
    name: musl (Alpine)
    # The eight-RID matrix proves each crate compiles for musl and links; only running the packaged
    # binaries inside a musl image proves the package a consumer installs actually loads there.
    # That is the item's own completion criterion — "installs and works on
    # mcr.microsoft.com/dotnet/runtime-deps:11.0-alpine" — so it is a gate, not a note: a package
    # whose musl library is absent or unloadable fails the build here instead of in a consumer's
    # container. The four examples are the same ones the `examples` job runs from the same packages.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Pack every package under test
        # The four native packages, plus the rest of the feed: Docx and Xlsx pin the compiler wrapper
        # and Docx's example converts through `.Documents`, so a feed holding one run's packages is
        # the only way those dependencies resolve to the build under test rather than to nuget.org.
        run: |
          for project in Text.Pdf Text.Templates Text.Mcp Text.Barcodes Text.Ocr Text.Docx Text.Xlsx Text.Typst Text.Documents; do
            dotnet pack "src/$project" -c Release --no-build -o artifacts/packages
          done
          ls -l artifacts/packages
      - name: Run one example per package on Alpine
        # A framework-dependent layout would leave the native library in the NuGet cache where the
        # container cannot see it, so each example is published self-contained for linux-musl-x64:
        # every native asset of the package is then on disk next to the executable, and the image is
        # the one a default .NET container ships.
        run: |
          chmod +x samples/examples/run.sh
          while read -r example package; do
            nupkg=$(ls "artifacts/packages/$package".*.nupkg | head -n 1)
            version=${nupkg#"artifacts/packages/$package".}
            export M3SCALINUM_PUBLISH_DIR="$PWD/artifacts/musl/$example"
            samples/examples/run.sh "$example" "$package" "${version%.nupkg}" "$PWD/artifacts/packages" --self-contained linux-musl-x64
            docker run --rm -v "$M3SCALINUM_PUBLISH_DIR:/app" -w /app \
              mcr.microsoft.com/dotnet/runtime-deps:11.0-alpine ./Example
          done <<'TABLE'
          Barcodes M3scalinum.Text.Barcodes
          Ocr M3scalinum.Text.Ocr
          Docx M3scalinum.Text.Docx
          Xlsx M3scalinum.Text.Xlsx
          Pdf M3scalinum.Text.Pdf
          TABLE

  musl-arm64:
    name: musl (Alpine arm64)
    # The job above, on the architecture the matrix now builds for: NuGet resolves
    # `linux-musl-arm64` to `linux-arm64` without a word, so an Alpine arm64 image — a Graviton node,
    # or an Apple Silicon host running Docker — would get a glibc library and fail with a
    # DllNotFoundException that names the RID and not the cause. Only running the packaged example
    # inside that image proves the arm64 asset loads; the matrix only proves it exists.
    needs: [native-extras]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      # No compiler artifact: the five packages under test carry their own libraries, and the
      # compiler wrapper the feed also needs is packed here without natives, as ci-sharptypst packs
      # it. The runner is arm64, so the Alpine image is pulled for arm64 with no `--platform`.
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Pack every package under test
        # The same nine the x64 job packs: Docx and Xlsx pin the compiler wrapper and Docx's example
        # converts through `.Documents`, so a feed holding one run's packages is the only way those
        # dependencies resolve to the build under test rather than to nuget.org.
        run: |
          for project in Text.Pdf Text.Templates Text.Mcp Text.Barcodes Text.Ocr Text.Docx Text.Xlsx Text.Typst Text.Documents; do
            dotnet pack "src/$project" -c Release --no-build -o artifacts/packages
          done
          ls -l artifacts/packages
      - name: Run one example per package on Alpine
        # Self-contained for `linux-musl-arm64`, so every native asset of the package lands next to
        # the executable instead of in a NuGet cache the container cannot see, and the image is the
        # one a default .NET container ships, on the architecture this runner is.
        run: |
          chmod +x samples/examples/run.sh
          while read -r example package; do
            nupkg=$(ls "artifacts/packages/$package".*.nupkg | head -n 1)
            version=${nupkg#"artifacts/packages/$package".}
            export M3SCALINUM_PUBLISH_DIR="$PWD/artifacts/musl-arm64/$example"
            samples/examples/run.sh "$example" "$package" "${version%.nupkg}" "$PWD/artifacts/packages" --self-contained linux-musl-arm64
            docker run --rm -v "$M3SCALINUM_PUBLISH_DIR:/app" -w /app \
              mcr.microsoft.com/dotnet/runtime-deps:11.0-alpine ./Example
          done <<'TABLE'
          Barcodes M3scalinum.Text.Barcodes
          Ocr M3scalinum.Text.Ocr
          Docx M3scalinum.Text.Docx
          Xlsx M3scalinum.Text.Xlsx
          Pdf M3scalinum.Text.Pdf
          TABLE

  examples:
    name: examples
    # One example per package, compiled and run against the `.nupkg` this job packs — never against a
    # project reference. A package that ships without an assembly, a dependency or a native library
    # fails here instead of in a consumer's application: `DllNotFoundException`, `NU1101` and a
    # missing resource all surface as a red example.
    #
    # The job packs all nine packages itself rather than downloading them: the compiler train's two
    # (Typst, Documents) are packed by no other job of this workflow, and a feed holding one run's
    # packages is the only way a transitive dependency resolves to the build under test.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Pack every package under test
        # Packed without `--build`: the build above already produced every TFM, and the native
        # artifacts are on disk where the csproj files look for them. A package without its
        # `runtimes/linux-x64/native/` entry is what the examples exist to catch.
        run: |
          for project in Text.Pdf Text.Templates Text.Mcp Text.Barcodes Text.Ocr Text.Docx Text.Xlsx Text.Typst Text.Documents; do
            dotnet pack "src/$project" -c Release --no-build -o artifacts/packages-examples
          done
          ls -l artifacts/packages-examples
      - name: Run one example per package
        # Each example is a console project generated outside the repository by `run.sh`, with an
        # exact PackageReference to the feed below. The project inherits no Directory.Build.props,
        # no central package management and no project reference, so the package is the only path.
        # The version comes from the packed file name, never from a constant.
        run: |
          chmod +x samples/examples/run.sh
          while read -r example package; do
            nupkg=$(ls "artifacts/packages-examples/$package".*.nupkg | head -n 1)
            version=${nupkg#"artifacts/packages-examples/$package".}
            samples/examples/run.sh "$example" "$package" "${version%.nupkg}" "$PWD/artifacts/packages-examples"
          done <<'TABLE'
          Pdf M3scalinum.Text.Pdf
          Templates M3scalinum.Text.Templates
          Mcp M3scalinum.Text.Mcp
          Barcodes M3scalinum.Text.Barcodes
          Ocr M3scalinum.Text.Ocr
          Docx M3scalinum.Text.Docx
          Xlsx M3scalinum.Text.Xlsx
          Typst M3scalinum.Text.Typst
          Documents M3scalinum.Text.Documents
          TABLE
      - name: Verify the Pdf package
        # The one package whose native library is packed for all eight RIDs, checked against the same
        # list `native-extras` builds: a missing entry fails here rather than as a
        # DllNotFoundException in a consumer's application. `--native` is what asks for the eight,
        # because the compiler workflow's pack job packs this package without them.
        run: python3 tests/verify-package.py artifacts/packages-examples/M3scalinum.Text.Pdf.*.nupkg --native
      - uses: actions/upload-artifact@v7
        # The `sbom` job reads the very packages the examples ran against, so the SBOM it checks
        # describes what a consumer installs rather than a second build that might differ.
        with:
          name: example-packages
          path: artifacts/packages-examples/*.nupkg
          if-no-files-found: error

  sbom:
    name: sbom
    # The release workflows generate and verify the SBOMs of the packages they publish; this job
    # runs the same tool on every pull request, over the packages the examples job just packed, so a
    # change to the crates, the RIDs or the nuspec that would produce an incomplete SBOM is red here
    # and not in the middle of a release. It also proves the verifier still rejects a broken SBOM.
    needs: [examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: example-packages
          path: artifacts/packages
      - name: Generate the SBOMs
        run: python3 .github/sbom/sbom.py generate --packages artifacts/packages --output artifacts/sbom
      - name: Verify the SBOMs
        run: python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom
      - name: Prove the verifier rejects a broken SBOM
        # A verifier that only ever passes proves nothing. Each package's SBOM is emptied in turn —
        # with every other SBOM still in place, so the failure can only come from the emptied one —
        # and the job goes red if `verify` accepts it.
        run: |
          for sbom in artifacts/sbom/*.cdx.json; do
            rm -rf artifacts/sbom-broken
            cp -r artifacts/sbom artifacts/sbom-broken
            python3 - "artifacts/sbom-broken/$(basename "$sbom")" <<'PY'
          import json, sys
          path = sys.argv[1]
          sbom = json.load(open(path, encoding="utf-8"))
          sbom["components"] = []
          open(path, "w", encoding="utf-8").write(json.dumps(sbom))
          PY
            if python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom-broken; then
              echo "verify accepted an SBOM with no components: $(basename "$sbom")" >&2
              exit 1
            fi
          done
          echo "verify rejected every emptied SBOM"
      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

  coverage-table:
    name: coverage table
    # The four jobs above each measure their own packages and fail below 90 %. This job publishes
    # the picture those gates add up to, which no artifact shows on its own: one table, one row per
    # shipped package, in the run summary and as an artifact.
    #
    # It does not re-apply the floor. A package below 90 % has already turned its own job red, and
    # `needs` means this job does not even start in that case — a second gate here would only ever
    # be redundant, and would make the table look like the authority on coverage when the jobs are.
    # What it does fail on is a package with *no report*: a job that stopped uploading, a package
    # dropped from a `--require` list, a project added to src/ that no job measures. That failure
    # mode leaves the gates green and the package invisible, which is exactly what the table is for.
    #
    # The `text` job is not in `needs`: it re-runs the Pdf and Mcp suites without collecting, so it
    # produces no report of its own.
    needs: [suite, templates, mcp, extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One artifact per job, into a directory named after the job. A suite's report also lists
      # every assembly it loaded, so the same package shows up in several artifacts at very
      # different figures; keeping the job's identity in the path is what lets the table read a
      # package from the job that owns it instead of guessing.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-text
          path: artifacts/coverage/suite
      - uses: actions/download-artifact@v8
        with:
          name: coverage-templates
          path: artifacts/coverage/templates
      - uses: actions/download-artifact@v8
        with:
          name: coverage-mcp
          path: artifacts/coverage/mcp
      - uses: actions/download-artifact@v8
        with:
          name: coverage-extras
          path: artifacts/coverage/extras
      - name: Prove the aggregation
        # Fabricated reports in a temp directory, including the missing-package case: the table is
        # exercised on every run rather than trusted because it worked the night it was written.
        run: python3 tests/coverage-table.py --selftest
      - name: Render the table
        run: >
          python3 tests/coverage-table.py artifacts/coverage --floor 90
          --markdown artifacts/coverage-table.md --json artifacts/coverage-table.json
      - name: Publish the summary
        # `always()`: when a report is missing the step above writes the table anyway and exits
        # non-zero, so the summary shows which package is absent instead of the job just going red.
        if: always()
        run: cat artifacts/coverage-table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-table
          path: |
            artifacts/coverage-table.md
            artifacts/coverage-table.json
          if-no-files-found: error

