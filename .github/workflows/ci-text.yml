name: ci (Text suite)

on:
  push:
    branches: [main]
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Read-only by default: no job here writes to the repository. The publish job of release-text.yml
# overrides this with the OIDC permission it needs.
permissions:
  contents: read


jobs:
  native:
    # Distinct from the compiler workflow's job of the same purpose: two jobs sharing a check name
    # make a required status check ambiguous.
    name: native (linux-x64, suite)
    runs-on: ubuntu-latest
    steps:
      # Only one RID: the Factur-X samples render once, on the runner, to be validated. The six
      # shipped runtimes, their tests and the leak soak belong to the compiler workflow.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sharp-typst
      - name: Build
        run: cargo build --release --manifest-path native/sharp-typst/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/sharp-typst/target/release/libsharp_typst.so
          if-no-files-found: error

  facturx:
    name: facturx
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Unit tests
        # No native library needed: reading, validating and writing are pure managed code.
        run: dotnet test tests/Text.Pdf.FactureX.Tests -c Release --no-build
      - name: Render the samples
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet run --project samples/Text.Pdf.FactureX.Samples -c Release --no-build
      - name: Validate against the official Factur-X schema
        # The FNFE-MPE library is the reference implementation: it extracts the attachment from the
        # PDF, reads the conformance level back and validates the XML against the official XSD.
        # It caught four real defects the string assertions could not see.
        run: |
          # A virtualenv, not a bare pip: the runner's Python is externally managed (PEP 668).
          python3 -m venv .venv-facturx
          .venv-facturx/bin/pip install --quiet factur-x lxml
          .venv-facturx/bin/python - <<'PY'
          import glob
          import io

          from facturx import get_facturx_level, get_xml_from_pdf, xml_check_xsd
          from lxml import etree

          failures = []

          for path in sorted(glob.glob("artifacts/samples/factur-x-*.pdf")):
              result = get_xml_from_pdf(io.BytesIO(open(path, "rb").read()), check_xsd=False)

              if not (isinstance(result, tuple) and isinstance(result[1], (bytes, bytearray))):
                  failures.append(f"{path}: no Factur-X attachment found")
                  continue

              name, xml = result
              level = get_facturx_level(etree.fromstring(xml))

              try:
                  xml_check_xsd(xml, level)
              except Exception as error:
                  failures.append(f"{path}: {error}")
                  continue

              print(f"{path}: {name}, {len(xml)} bytes, {level}, XSD ok")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install veraPDF
        # The only distribution is an IzPack installer, which takes its answers from a file. The
        # GUI, the corpus and the documentation are of no use here: only the command line is kept.
        # The heredoc is unquoted on purpose: IzPack does not expand variables, so a quoted one
        # installs into a directory literally named `${GITHUB_WORKSPACE}`.
        run: |
          curl -sSL -o verapdf-installer.zip https://software.verapdf.org/rel/verapdf-installer.zip
          unzip -q -o verapdf-installer.zip
          cat > verapdf-auto-install.xml <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
          <installpath>${GITHUB_WORKSPACE}/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="true"/>
          <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
          <pack index="3" name="veraPDF Validation model" selected="true"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar verapdf-greenfield-*/verapdf-izpack-installer-*.jar verapdf-auto-install.xml
          ./verapdf/verapdf --version
      - name: Validate PDF/A-3B
        # The flavour is passed explicitly: left to itself, veraPDF believes the file's own claim
        # and validates against PDF/A-1b. Exit 0 is compliant, 1 is not, 7 is an unparseable file.
        run: ./verapdf/verapdf --flavour 3b --format text artifacts/samples/factur-x-*.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: facturx-samples
          path: artifacts/samples/factur-x-*.pdf

  suite:
    name: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Public surface and documentation
        # Loads every assembly of the suite by reflection, then reads docs/specifications, wiki/ and
        # README.md. A documented type or method that does not exist fails here.
        run: dotnet test tests/Text.Suite.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (facturx)
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/facturx.xml
          "dotnet test tests/Text.Pdf.FactureX.Tests -c Release --no-build"
      - name: Collect (pdf)
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/pdf.xml
          "dotnet test tests/Text.Pdf.Tests -c Release --no-build"
      - name: Merge
        run: >
          dotnet-coverage merge -f cobertura -o artifacts/coverage/coverage.xml
          artifacts/coverage/facturx.xml artifacts/coverage/pdf.xml
      - name: Gate
        # The coverage gate for this train lives here, not in the compiler workflow: a change to
        # these packages no longer starts that workflow, so its gate would never see it.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/coverage.xml 90
          --require M3scalinum.Text.Pdf M3scalinum.Text.Pdf.FactureX
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-text
          path: artifacts/coverage/coverage.xml

  templates:
    name: templates
    # The pack ships layouts, and the only way to know a layout renders is to render it: these
    # tests need the native compiler, which the suite job deliberately does not download.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Templates.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (templates)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/templates.xml
          "dotnet test tests/Text.Templates.Tests -c Release --no-build"
      - name: Gate
        # Only the pack's own assembly: the compiler wrapper is linked into the output as a
        # dependency, and counting its lines here would measure code no test in this run touches.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/templates.xml 90
          --require M3scalinum.Text.SharpTypst.Templates
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-templates
          path: artifacts/coverage/templates.xml
      - name: Pack
        run: dotnet pack src/Text.SharpTypst.Templates -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # The same check the release runs: a satellite must pin the core version it was built
        # against, and the licence files must be in the package.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Templates.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-templates
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  mcp:
    name: mcp
    # The protocol surface needs no compiler, but the render tools and the invoice payload do: the
    # job downloads the same artifact the templates job uses, so the coverage it collects measures the
    # tools a client actually calls rather than their argument checks alone.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (mcp)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/mcp.xml
          "dotnet test tests/Text.Mcp.Tests -c Release --no-build"
      - name: Gate
        # Only the server's own assembly: the compiler wrapper and the e-invoicing package are linked
        # into the output as dependencies, and counting their lines would measure code these tests
        # use rather than code they own.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/mcp.xml 90
          --require M3scalinum.Text.Mcp
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-mcp
          path: artifacts/coverage/mcp.xml
      - name: Pack
        run: dotnet pack src/Text.Mcp -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # A satellite must pin the core version it was built against, and carry the licence files.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Mcp.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-mcp
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  text:
    name: text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        # Neither package touches the compiler: signing takes bytes and returns bytes, and the
        # Factur-X reader, writer and validator are pure managed code. The MCP server's protocol
        # tests need nothing either; its render tests skip themselves without the native library.
        run: |
          dotnet test tests/Text.Pdf.Tests -c Release --no-build
          dotnet test tests/Text.Pdf.FactureX.Tests -c Release --no-build
          dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Pack
        run: |
          dotnet pack src/Text.Pdf -c Release -o artifacts/packages
          dotnet pack src/Text.Pdf.FactureX -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages-text
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  native-extras:
    # The three libraries that are not the compiler: barcodes, OCR and the DOCX reader. Each is its own
    # crate with its own Cargo.lock, and before this job existed nothing compiled them — a Dependabot
    # bump of `zip` in native/text-docx reached main with every check green and a broken build.
    name: native (${{ matrix.crate }}, ${{ matrix.rid }})
    # Five RIDs per crate, the same set the package ships, because `verify-package.py` demands every
    # one of them: a linux-only job packs a package with one native and the check then fails, or worse,
    # passes for a package missing four architectures. The compiler workflow pays the same price for
    # the compiler's six.
    strategy:
      fail-fast: false
      matrix:
        crate: [text-barcodes, text-ocr, text-docx]
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/${{ matrix.crate }}
      - name: Format
        working-directory: native/${{ matrix.crate }}
        run: cargo fmt --check
      - name: Clippy
        working-directory: native/${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        working-directory: native/${{ matrix.crate }}
        run: cargo test --lib
      - name: Build
        working-directory: native/${{ matrix.crate }}
        run: cargo build --release
      - name: Stage the library
        shell: bash
        run: |
          mkdir -p "native/artifacts/${{ matrix.rid }}"
          cp native/${{ matrix.crate }}/target/release/*sharp_text*.* "native/artifacts/${{ matrix.rid }}/"
          ls -l "native/artifacts/${{ matrix.rid }}/"
      - uses: actions/upload-artifact@v7
        # The artifact root is `native/artifacts`, so a merged download reassembles `<rid>/<library>`,
        # the layout the csproj files pack from.
        with:
          name: ${{ matrix.crate }}-${{ matrix.rid }}
          path: native/artifacts
          if-no-files-found: error

  extras:
    name: extras
    # Five packages in one job: two are pure managed (charts, epub) and three carry their own native
    # library. One job keeps the coverage measurement per assembly explicit rather than spreading five
    # near-identical jobs across the workflow.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
        run: |
          dotnet test tests/Text.Barcodes.Tests -c Release --no-build
          dotnet test tests/Text.Docx.Tests -c Release --no-build
          dotnet test tests/Text.Epub.Tests -c Release --no-build
          dotnet test tests/Text.Charts.Tests -c Release --no-build
          dotnet test tests/Text.Ocr.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
        run: |
          dotnet-coverage collect -f cobertura -o artifacts/coverage/barcodes.xml "dotnet test tests/Text.Barcodes.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/docx.xml "dotnet test tests/Text.Docx.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/epub.xml "dotnet test tests/Text.Epub.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/charts.xml "dotnet test tests/Text.Charts.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/ocr.xml "dotnet test tests/Text.Ocr.Tests -c Release --no-build"
          dotnet-coverage merge -f cobertura -o artifacts/coverage/extras.xml artifacts/coverage/barcodes.xml artifacts/coverage/docx.xml artifacts/coverage/epub.xml artifacts/coverage/charts.xml artifacts/coverage/ocr.xml
      - name: Gate
        # One gate per package, not one over the merge: a merged figure lets a package at 62 % hide
        # behind another at 96 %, and it names no culprit when the build goes red. Each package is
        # measured on its own assembly, which is also what `--require` scopes the count to.
        run: |
          python3 tests/coverage-gate.py artifacts/coverage/barcodes.xml 90 --require M3scalinum.Text.Barcodes
          python3 tests/coverage-gate.py artifacts/coverage/charts.xml 90 --require M3scalinum.Text.Charts
          python3 tests/coverage-gate.py artifacts/coverage/docx.xml 90 --require M3scalinum.Text.Docx
          python3 tests/coverage-gate.py artifacts/coverage/epub.xml 90 --require M3scalinum.Text.Epub
          python3 tests/coverage-gate.py artifacts/coverage/ocr.xml 90 --require M3scalinum.Text.Ocr
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-extras
          path: artifacts/coverage/extras.xml
      - name: Pack
        run: |
          dotnet pack src/Text.Barcodes -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Charts -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Docx -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Epub -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Ocr -c Release --no-build -o artifacts/packages
      - name: Verify the packages
        # Three of them carry a native library each: a missing RID fails here rather than as a
        # DllNotFoundException in a consumer's application.
        run: |
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Barcodes.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Charts.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Docx.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Epub.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Ocr.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-extras
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
