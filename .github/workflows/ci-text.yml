name: ci (Text suite)

on:
  push:
    branches: [main]
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    # Not `**.md`: tests/Text.Suite.Tests reads docs/specifications/, wiki/ and README.md, and fails
    # when a documented type or method does not exist. Ignoring every markdown file would let exactly
    # the drift those tests catch land untested, on the one kind of change that causes it. Only the
    # files it does not read are skipped here.
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Bump this to invalidate the native caches below; the crate source is hashed into the key.
  NATIVE_CACHE_VERSION: v1

# Read-only by default: no job here writes to the repository. The publish job of release-text.yml
# overrides this with the OIDC permission it needs.
permissions:
  contents: read

# A branch pushed three times otherwise runs three pipelines over the same commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  native:
    # Distinct from the compiler workflow's job of the same purpose: two jobs sharing a check name
    # make a required status check ambiguous.
    name: native (linux-x64, suite)
    runs-on: ubuntu-latest
    steps:
      # Only one RID: the suite builds and runs once, on the runner. The six
      # shipped runtimes, their tests and the leak soak belong to the compiler workflow.
      #
      - uses: actions/checkout@v7
      # Scoped `-suite-` on purpose: this job only *builds*, the compiler workflow's linux-x64 entry
      # also runs fmt, clippy and the crate's tests. A shared key would let whichever ran first skip
      # the other's gates. Restored after the checkout, because `hashFiles` reads the workspace.
      - uses: actions/cache@v4
        id: natives
        with:
          path: native/artifacts/linux-x64
          key: natives-typst-linux-x64-suite-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles('native/sharp-typst/Cargo.toml', 'native/sharp-typst/Cargo.lock', 'native/sharp-typst/build.rs', 'native/sharp-typst/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.natives.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.natives.outputs.cache-hit != 'true'
        with:
          workspaces: native/sharp-typst
      - name: Build
        if: steps.natives.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path native/sharp-typst/Cargo.toml
      - name: Stage the library
        if: steps.natives.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p native/artifacts/linux-x64
          cp native/sharp-typst/target/release/libsharp_typst.so native/artifacts/linux-x64/
          ls -l native/artifacts/linux-x64/
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64/libsharp_typst.so
          if-no-files-found: error

  suite:
    name: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Public surface and documentation
        # Loads every assembly of the suite by reflection, then reads docs/specifications, wiki/ and
        # README.md. A documented type or method that does not exist fails here.
        run: dotnet test tests/Text.Suite.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (pdf)
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/pdf.xml
          "dotnet test tests/Text.Pdf.Tests -c Release --no-build"
      - name: Merge
        run: >
          dotnet-coverage merge -f cobertura -o artifacts/coverage/coverage.xml
          artifacts/coverage/pdf.xml
      - name: Gate
        # The coverage gate for this train lives here, not in the compiler workflow: a change to
        # these packages no longer starts that workflow, so its gate would never see it.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/coverage.xml 90
          --require M3scalinum.Text.Pdf
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-text
          path: artifacts/coverage/coverage.xml

  templates:
    name: templates
    # The pack ships layouts, and the only way to know a layout renders is to render it: these
    # tests need the native compiler, which the suite job deliberately does not download.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Templates.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (templates)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/templates.xml
          "dotnet test tests/Text.Templates.Tests -c Release --no-build"
      - name: Gate
        # Only the pack's own assembly: the compiler wrapper is linked into the output as a
        # dependency, and counting its lines here would measure code no test in this run touches.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/templates.xml 90
          --require M3scalinum.Text.Templates
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-templates
          path: artifacts/coverage/templates.xml
      - name: Pack
        run: dotnet pack src/Text.Templates -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # The same check the release runs: a satellite must pin the core version it was built
        # against, and the licence files must be in the package.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Templates.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-templates
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  mcp:
    name: mcp
    # The protocol surface needs no compiler, but the render tools and the invoice payload do: the
    # job downloads the same artifact the templates job uses, so the coverage it collects measures the
    # tools a client actually calls rather than their argument checks alone.
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect (mcp)
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
        run: >
          dotnet-coverage collect -f cobertura -o artifacts/coverage/mcp.xml
          "dotnet test tests/Text.Mcp.Tests -c Release --no-build"
      - name: Gate
        # Only the server's own assembly: the compiler wrapper and the e-invoicing package are linked
        # into the output as dependencies, and counting their lines would measure code these tests
        # use rather than code they own.
        run: >
          python3 tests/coverage-gate.py artifacts/coverage/mcp.xml 90
          --require M3scalinum.Text.Mcp
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-mcp
          path: artifacts/coverage/mcp.xml
      - name: Pack
        run: dotnet pack src/Text.Mcp -c Release --no-build -o artifacts/packages
      - name: Verify the package
        # A satellite must pin the core version it was built against, and carry the licence files.
        run: python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Mcp.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-mcp
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  text:
    name: text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        # Neither package touches the compiler: signing takes bytes and returns bytes, and the MCP
        # server's protocol tests need nothing either; its render tests skip themselves without the
        # native library.
        run: |
          dotnet test tests/Text.Pdf.Tests -c Release --no-build
          dotnet test tests/Text.Mcp.Tests -c Release --no-build
      - name: Pack
        run: |
          dotnet pack src/Text.Pdf -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages-text
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  native-extras:
    # The four libraries that are not the compiler: barcodes, OCR, and the DOCX and XLSX readers. Each
    # is its own crate with its own Cargo.lock, and before this job existed nothing compiled them — a
    # Dependabot bump of `zip` in native/text-docx reached main with every check green and a broken
    # build.
    name: native (${{ matrix.crate }}, ${{ matrix.rid }})
    # Five RIDs per crate, the same set the package ships, because `verify-package.py` demands every
    # one of them: a linux-only job packs a package with one native and the check then fails, or worse,
    # passes for a package missing four architectures. The compiler workflow pays the same price for
    # the compiler's six.
    strategy:
      fail-fast: false
      matrix:
        crate: [text-barcodes, text-ocr, text-docx, text-xlsx]
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx]
        # `rid` is an axis, not an `include` entry: an include that adds a key absent from every
        # combination is merged into each of them in turn, so the last one wins and the matrix
        # collapses to the crates on macOS alone. Crossing on both axes and letting these entries
        # supply the runner per rid gives the 15 combinations the packages actually need.
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Fifteen Rust builds that no managed change can invalidate: each crate is hashed on its own,
      # so a pull request touching only C# restores all fifteen libraries instead of compiling them.
      # Restored after the checkout, because `hashFiles` reads the workspace.
      - uses: actions/cache@v4
        id: natives
        with:
          path: native/artifacts/${{ matrix.rid }}
          key: natives-${{ matrix.crate }}-${{ matrix.rid }}-${{ env.NATIVE_CACHE_VERSION }}-${{ hashFiles(format('native/{0}/Cargo.toml', matrix.crate), format('native/{0}/Cargo.lock', matrix.crate), format('native/{0}/src/**', matrix.crate)) }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.natives.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.natives.outputs.cache-hit != 'true'
        with:
          workspaces: native/${{ matrix.crate }}
      - name: Format
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo fmt --check
      - name: Clippy
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo test --lib
      - name: Build
        if: steps.natives.outputs.cache-hit != 'true'
        working-directory: native/${{ matrix.crate }}
        run: cargo build --release
      - name: Stage the library
        if: steps.natives.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "native/artifacts/${{ matrix.rid }}"
          cp native/${{ matrix.crate }}/target/release/*sharp_text*.* "native/artifacts/${{ matrix.rid }}/"
          ls -l "native/artifacts/${{ matrix.rid }}/"
      - uses: actions/upload-artifact@v7
        # The artifact root is `native/artifacts`, so a merged download reassembles `<rid>/<library>`,
        # the layout the csproj files pack from.
        with:
          name: ${{ matrix.crate }}-${{ matrix.rid }}
          path: native/artifacts
          if-no-files-found: error

  extras:
    name: extras
    # Three packages in one job, each carrying its own native library. One job keeps the coverage
    # measurement per assembly explicit rather than spreading three near-identical jobs across the
    # workflow.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Tests
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
          SHARPTEXTXLSX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_xlsx.so
        run: |
          dotnet test tests/Text.Barcodes.Tests -c Release --no-build
          dotnet test tests/Text.Docx.Tests -c Release --no-build
          dotnet test tests/Text.Ocr.Tests -c Release --no-build
          dotnet test tests/Text.Xlsx.Tests -c Release --no-build
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Collect
        env:
          SHARPTYPST_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_typst.so
          BARCODES_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_barcodes.so
          M3SCALINUM_OCR_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_ocr.so
          SHARPTEXTDOCX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_docx.so
          SHARPTEXTXLSX_NATIVE_PATH: ${{ github.workspace }}/native/artifacts/linux-x64/libsharp_text_xlsx.so
        run: |
          dotnet-coverage collect -f cobertura -o artifacts/coverage/barcodes.xml "dotnet test tests/Text.Barcodes.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/docx.xml "dotnet test tests/Text.Docx.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/ocr.xml "dotnet test tests/Text.Ocr.Tests -c Release --no-build"
          dotnet-coverage collect -f cobertura -o artifacts/coverage/xlsx.xml "dotnet test tests/Text.Xlsx.Tests -c Release --no-build"
          dotnet-coverage merge -f cobertura -o artifacts/coverage/extras.xml artifacts/coverage/barcodes.xml artifacts/coverage/docx.xml artifacts/coverage/ocr.xml artifacts/coverage/xlsx.xml
      - name: Gate
        # One gate per package, not one over the merge: a merged figure lets a package at 62 % hide
        # behind another at 96 %, and it names no culprit when the build goes red. Each package is
        # measured on its own assembly, which is also what `--require` scopes the count to.
        run: |
          python3 tests/coverage-gate.py artifacts/coverage/barcodes.xml 90 --require M3scalinum.Text.Barcodes
          python3 tests/coverage-gate.py artifacts/coverage/docx.xml 90 --require M3scalinum.Text.Docx
          python3 tests/coverage-gate.py artifacts/coverage/ocr.xml 90 --require M3scalinum.Text.Ocr
          python3 tests/coverage-gate.py artifacts/coverage/xlsx.xml 90 --require M3scalinum.Text.Xlsx
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-extras
          path: artifacts/coverage/extras.xml
      - name: Pack
        run: |
          dotnet pack src/Text.Barcodes -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Docx -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Ocr -c Release --no-build -o artifacts/packages
          dotnet pack src/Text.Xlsx -c Release --no-build -o artifacts/packages
      - name: Verify the packages
        # Three of them carry a native library each: a missing RID fails here rather than as a
        # DllNotFoundException in a consumer's application.
        run: |
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Barcodes.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Docx.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Ocr.*.nupkg
          python3 tests/verify-package.py artifacts/packages/M3scalinum.Text.Xlsx.*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-extras
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  examples:
    name: examples
    # One example per package, compiled and run against the `.nupkg` this job packs — never against a
    # project reference. A package that ships without an assembly, a dependency or a native library
    # fails here instead of in a consumer's application: `DllNotFoundException`, `NU1101` and a
    # missing resource all surface as a red example.
    #
    # The job packs all nine packages itself rather than downloading them: the compiler train's two
    # (Typst, Documents) are packed by no other job of this workflow, and a feed holding one run's
    # packages is the only way a transitive dependency resolves to the build under test.
    needs: [native, native-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v8
        with:
          pattern: text-*-*
          merge-multiple: true
          path: native/artifacts
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Pack every package under test
        # Packed without `--build`: the build above already produced every TFM, and the native
        # artifacts are on disk where the csproj files look for them. A package without its
        # `runtimes/linux-x64/native/` entry is what the examples exist to catch.
        run: |
          for project in Text.Pdf Text.Templates Text.Mcp Text.Barcodes Text.Ocr Text.Docx Text.Xlsx Text.Typst Text.Documents; do
            dotnet pack "src/$project" -c Release --no-build -o artifacts/packages-examples
          done
          ls -l artifacts/packages-examples
      - name: Run one example per package
        # Each example is a console project generated outside the repository by `run.sh`, with an
        # exact PackageReference to the feed below. The project inherits no Directory.Build.props,
        # no central package management and no project reference, so the package is the only path.
        # The version comes from the packed file name, never from a constant.
        run: |
          chmod +x samples/examples/run.sh
          while read -r example package; do
            nupkg=$(ls "artifacts/packages-examples/$package".*.nupkg | head -n 1)
            version=${nupkg#"artifacts/packages-examples/$package".}
            samples/examples/run.sh "$example" "$package" "${version%.nupkg}" "$PWD/artifacts/packages-examples"
          done <<'TABLE'
          Pdf M3scalinum.Text.Pdf
          Templates M3scalinum.Text.Templates
          Mcp M3scalinum.Text.Mcp
          Barcodes M3scalinum.Text.Barcodes
          Ocr M3scalinum.Text.Ocr
          Docx M3scalinum.Text.Docx
          Xlsx M3scalinum.Text.Xlsx
          Typst M3scalinum.Text.Typst
          Documents M3scalinum.Text.Documents
          TABLE
      - uses: actions/upload-artifact@v7
        # The `sbom` job reads the very packages the examples ran against, so the SBOM it checks
        # describes what a consumer installs rather than a second build that might differ.
        with:
          name: example-packages
          path: artifacts/packages-examples/*.nupkg
          if-no-files-found: error

  sbom:
    name: sbom
    # The release workflows generate and verify the SBOMs of the packages they publish; this job
    # runs the same tool on every pull request, over the packages the examples job just packed, so a
    # change to the crates, the RIDs or the nuspec that would produce an incomplete SBOM is red here
    # and not in the middle of a release. It also proves the verifier still rejects a broken SBOM.
    needs: [examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: example-packages
          path: artifacts/packages
      - name: Generate the SBOMs
        run: python3 .github/sbom/sbom.py generate --packages artifacts/packages --output artifacts/sbom
      - name: Verify the SBOMs
        run: python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom
      - name: Prove the verifier rejects a broken SBOM
        # A verifier that only ever passes proves nothing. Each package's SBOM is emptied in turn —
        # with every other SBOM still in place, so the failure can only come from the emptied one —
        # and the job goes red if `verify` accepts it.
        run: |
          for sbom in artifacts/sbom/*.cdx.json; do
            rm -rf artifacts/sbom-broken
            cp -r artifacts/sbom artifacts/sbom-broken
            python3 - "artifacts/sbom-broken/$(basename "$sbom")" <<'PY'
          import json, sys
          path = sys.argv[1]
          sbom = json.load(open(path, encoding="utf-8"))
          sbom["components"] = []
          open(path, "w", encoding="utf-8").write(json.dumps(sbom))
          PY
            if python3 .github/sbom/sbom.py verify --packages artifacts/packages --sbom artifacts/sbom-broken; then
              echo "verify accepted an SBOM with no components: $(basename "$sbom")" >&2
              exit 1
            fi
          done
          echo "verify rejected every emptied SBOM"
      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

