name: cargo deny

# What tools/check-dependencies.py cannot see. The policy in docs/specifications/dependencies.md is
# checked statically today: it reads the Cargo.toml files and the register and compares the two,
# which catches a crate that arrived without a decision but never reads a transitive crate's real
# licence, an advisory, or a duplicate version. `cargo deny` reads the whole resolved graph of a
# lock file and does exactly that. The two checks are complements, not alternatives: keep both.
#
# The configuration is deny.toml at the root of the repository, one file for the five crates, because
# each crate is its own manifest with its own lock file.

on:
  pull_request:
    # A pull request that touches neither a manifest, a lock file, the configuration nor this file
    # cannot change the answer. `deny.toml` is in the list because widening the allow list or
    # ignoring an advisory is the change this check exists to make visible.
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yml'
  # The advisory database moves without the repository moving: a manual run is how a tree that has
  # not changed in a month is re-asked whether it is still clean.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new cargo-deny release cannot turn this check red, or green, on its own. Bumping it
  # is a reviewed change: a new version can add a diagnostic category, and deny.toml has to be read
  # against it.
  CARGO_DENY_VERSION: 0.22.0

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A prebuilt binary: `cargo install cargo-deny` compiles for minutes on every run, and this
      # check has to be cheap enough to be required on every pull request that touches a manifest.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      # The advisory database is a git clone of ~50 MB. Restoring the previous run's copy makes the
      # fetch incremental; the per-run key means a run always saves its own snapshot, so the cache
      # cannot pin the database to a month-old commit.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-dbs
          key: cargo-deny-advisory-db-${{ github.run_id }}
          restore-keys: |
            cargo-deny-advisory-db-

      # One job, one advisory database, five crates, reported together. A matrix would clone the
      # database five times in parallel for the same answer; `::group::` keeps each crate's output
      # collapsible, and the loop deliberately runs all five before failing so a pull request that
      # breaks two crates costs one round trip instead of two.
      #
      # `bans` covers wildcard requirements, duplicate versions and a banned-crate list that is
      # empty today; `licenses` and `advisories` are the two the board item asked for.
      - name: licences, advisories and bans
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for manifest in native/*/Cargo.toml; do
            echo "::group::$(dirname "$manifest")"
            # `--locked` so a check never rewrites a Cargo.lock on its way past; the lock file is a
            # reviewed artifact of its own. `--config` is not decoration: cargo-deny reads its
            # configuration from the working directory only, so a run started elsewhere would fall
            # back to the default and reject every licence in the graph.
            cargo deny --config deny.toml --locked --manifest-path "$manifest" check bans licenses advisories || status=1
            echo "::endgroup::"
          done
          exit "$status"
