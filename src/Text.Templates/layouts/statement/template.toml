name = "statement"
version = "1.0.0"
entry = "template.typ"
description = "A4 account statement (relevé de compte): opening balance, dated movements with their running balance, and the closing balance, with every label supplied by the caller"
authors = ["m3scalinum"]

[parameters]
title = { type = "string", required = true }
number = { type = "string", required = true }
issued = { type = "date", required = true }
period_start = { type = "date", required = true }
period_end = { type = "date", required = true }
account = { type = "object", required = true }
opening_balance = { type = "number", required = true }
transactions = { type = "array", of = "object", required = true }
currency = { type = "string", default = "EUR" }
labels = { type = "object", required = true }
notes = { type = "string", default = "" }
